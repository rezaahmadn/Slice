name: Slice
options:
  bundleIdPrefix: com.rezaahmadn
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Ad-hoc signing: runs on this Mac without an Apple Developer account.
    # Swap to Developer ID later by changing only these three lines.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: NO

targets:
  Slice:
    type: application
    platform: macOS
    sources:
      - path: Slice
    info:
      path: Slice/Info.plist
      properties:
        CFBundleDisplayName: Slice
        CFBundleName: Slice
        # Menu-bar-only app: no Dock icon, no app menu.
        LSUIElement: true
        NSHumanReadableCopyright: "MIT License"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rezaahmadn.Slice
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_STRICT_CONCURRENCY: complete

  SliceTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: SliceTests
    dependencies:
      - target: Slice
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rezaahmadn.SliceTests
        # Test bundles need an Info.plist too; let Xcode generate it.
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Slice:
    build:
      targets:
        Slice: all
        SliceTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - SliceTests
